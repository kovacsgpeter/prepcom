# Szűk YAML-részhalmaz: csak blokk-mapping, 2 szóköz behúzás, # megjegyzés, skalár érték (sima vagy idézőjeles)
# NINCS flow-mapping ({}), lista, horgony, többsoros skalár

version: 1

